services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data

  airflow-init:
    build: .
    depends_on: [postgres]
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username $${_AIRFLOW_WWW_USER_USERNAME:-admin} --password $${_AIRFLOW_WWW_USER_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com"

    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "freight_analytics_warehouse_secret_key_prod"
      AIRFLOW_TARGET_ENV: "prod"
      AIRFLOW__CORE__PARALLELISM: 4
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 4
      AIRFLOW__WEBSERVER__WORKERS: 2
      AIRFLOW__WEBSERVER__AUTH_ROLE_PUBLIC: "Viewer"
      AIRFLOW__WEBSERVER__RBAC: "true"
    env_file: [../.env]

  airflow-webserver:
    build: .
    depends_on: [airflow-init]
    command: webserver
    ports: ["8080:8080"]
    environment: *airflow-env
    env_file: [../.env]
    volumes:
      - ./dags:/opt/airflow/dags
      - ../dbt:/opt/airflow/dbt
      - ../ai:/opt/airflow/ai

  airflow-scheduler:
    build: .
    depends_on: [airflow-init]
    command: scheduler
    environment: *airflow-env
    env_file: [../.env]
    volumes:
      - ./dags:/opt/airflow/dags
      - ../dbt:/opt/airflow/dbt
      - ../ai:/opt/airflow/ai

volumes:
  airflow-db:
