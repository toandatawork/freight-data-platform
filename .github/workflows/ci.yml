name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # Job 1: Linter check (Verifies SQL formatting & conventions via SQLFluff).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies via uv
        run: uv sync --all-extras

      - name: Run SQLFluff linter
        run: uv run sqlfluff lint dbt/models

  # Job 2: Schema & contract validation using --empty flag (Zero cloud compute cost).
  validate-empty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync

      - name: Install dbt packages
        run: cd dbt && uv run dbt deps

      - name: Validate dbt models with --empty flag on freight_ci
        run: |
          cd dbt
          uv run dbt build --select marts --empty --target ci --profiles-dir .
        env:
          DBX_HOST: ${{ secrets.DBX_HOST }}
          DBX_HTTP_PATH: ${{ secrets.DBX_HTTP_PATH }}
          DBX_TOKEN: ${{ secrets.DBX_TOKEN }}
