name: CD - Deploy Documentation & Artifacts

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: cd dbt && uv run dbt deps
      - run: cd dbt && uv run dbt docs generate --profiles-dir .
        env:
          DBX_HOST: ${{ secrets.DBX_HOST }}
          DBX_HTTP_PATH: ${{ secrets.DBX_HTTP_PATH }}
          DBX_TOKEN: ${{ secrets.DBX_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
