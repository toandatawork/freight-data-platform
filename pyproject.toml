[project]
name = "trusted-delivery-analytics"
version = "0.1.0"
description = "Freight analytics warehouse with a metadata-driven data quality layer"
readme = "README.md"
authors = [
    { name = "Larry", email = "huutoan.work.47586@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.117.0",
    "dbt-core>=1.12.0",
    "dbt-databricks>=1.12.4",
    "fastapi>=0.141.1",
    "requests>=2.34.2",
]

[tool.uv]
# This repository is an application, not a distributable package.
# Without this, uv tries to build a module at src/ and fails.
package = false
