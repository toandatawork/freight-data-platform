version: 2

sources:
  - name: bronze
    database: "{{ target.catalog }}"
    schema: bronze
    tables:
      - name: customers
        config:
          loaded_at_field: _ingested_at
      - name: trucks
        config:
          loaded_at_field: _ingested_at
      - name: trailers
        config:
          loaded_at_field: _ingested_at
      - name: facilities
        config:
          loaded_at_field: _ingested_at
      - name: routes
        config:
          loaded_at_field: _ingested_at
      - name: drivers
        config:
          loaded_at_field: _ingested_at
      - name: loads
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: { count: 12, period: hour }
            error_after: { count: 24, period: hour }
      - name: trips
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: { count: 12, period: hour }
            error_after: { count: 24, period: hour }
      - name: delivery_events
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: { count: 12, period: hour }
            error_after: { count: 24, period: hour }
      - name: fuel_purchases
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: { count: 12, period: hour }
            error_after: { count: 24, period: hour }
      - name: maintenance_records
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: { count: 12, period: hour }
            error_after: { count: 24, period: hour }
      - name: safety_incidents
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: { count: 12, period: hour }
            error_after: { count: 24, period: hour }
      - name: driver_monthly_metrics
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: { count: 12, period: hour }
            error_after: { count: 24, period: hour }
      - name: truck_utilization_metrics
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: { count: 12, period: hour }
            error_after: { count: 24, period: hour }

